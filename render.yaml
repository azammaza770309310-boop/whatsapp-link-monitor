# Render Blueprint — WhatsApp & Telegram Link Monitor
# مستند: https://render.com/docs/blueprint-spec
# هذا الملف يعرّف خدمة واحدة (Background Worker) تشغّل bot.py
# Render سيقرأ هذا الملف تلقائياً عند النشر.

services:
  - type: worker
    name: whatsapp-link-monitor
    runtime: python
    region: oregon  # أو frankfurt حسب الأقرب لمستخدميك
    plan: free  # أو starter للإنتاج
    branch: main
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      # === متغيرات مطلوبة (أدخل قيمها من لوحة Render) ===
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: CHANNEL_ID
        sync: false
      # === Supabase ===
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        # ⚠️ مهم: استخدم service_role secret (وليس anon key)
        # Supabase Dashboard → Settings → API → "service_role secret"
        sync: false
      # === AI (اختياري) ===
      - key: OPENAI_API_KEY
        sync: false
      - key: AI_BATCH_MODE
        value: "true"  # true = تخطّي AI للسرعة | false = فحص كامل
      # === [N07] AI_DRAIN_ENABLED — opt-in background drainer for the
      # ai_pending backlog (26,475 pending links in production). Default
      # false: batch mode intentionally skips AI on the hot path; flipping
      # this to true starts a 30s drainer that runs AI on up to 10 NULL-
      # ai_approved rows per cycle and PATCHes the verdict back. Leave
      # false unless AI_BATCH_MODE=true is also set. ===
      # [Task 4a hardened] The drainer is now bounded-concurrency,
      # rate-limited, lease-protected, idempotent, observable, restart-
      # safe, and graceful-shutdown-capable. See _ai_drainer_worker
      # docstring for the full guarantee matrix. Defaults below preserve
      # backward-compatible behavior (AI_DRAIN_ENABLED=false → idle). ===
      - key: AI_DRAIN_ENABLED
        value: "false"
      # [Task 4a] AI_DRAIN_BATCH_SIZE — rows per 30s cycle (default 10).
      # At 10 rows/cycle × 2 cycles/min = 20 rows/min ≈ 22h to clear the
      # 26,475 backlog. Bump to 20 only if the AI provider headroom allows.
      - key: AI_DRAIN_BATCH_SIZE
        value: "10"
      # [Task 4a] AI_DRAIN_CONCURRENCY — max concurrent analyze_message
      # calls per batch via asyncio.Semaphore (default 3). With batch
      # mode ON, the drainer is the SOLE AI consumer — 3 concurrent calls
      # is well within Groq's 30 RPM / OpenAI's 60 RPM. If AI_BATCH_MODE
      # is set to false (live AI on hot path), set this to 1 to serialize
      # drainer calls behind the live path.
      - key: AI_DRAIN_CONCURRENCY
        value: "3"
      # [Task 4a] AI_DRAIN_TIMEOUT_S — per-row analyze_message timeout via
      # asyncio.wait_for (default 60s). On timeout the row stays ai_pending
      # (no permanent claim); the in-memory retry cap (3 fails) then skips
      # it on subsequent cycles so a poison row can't burn the AI budget.
      - key: AI_DRAIN_TIMEOUT_S
        value: "60"
      # === اختياري ===
      - key: OWNER_ID
        sync: false
      # [Req-2] STARTUP_SCAN_DAYS — proactive history discovery. On every
      # startup, each connected monitor scans its last N days of message
      # history (bounded by HISTORY_MAX_PER_CHAT=500 msgs/chat) to find
      # groups mentioned in older messages — not just wait for new ones.
      # _run_startup_scan was previously dead code; it is now wired into
      # start() and gated on this env. Default 7 (one week) balances
      # coverage vs API load (~1400 iter_messages calls per monitor, runs
      # in the background). Set to empty/None to disable.
      - key: STARTUP_SCAN_DAYS
        value: "7"
      # === Render يضبط PORT تلقائياً ===
      - key: PORT
        value: "10000"
      - key: PYTHON_VERSION
        value: "3.11.9"
      # === [B01] DATA_DIR — MUST point to a persistent Render Disk (attach a
      # Disk ≥1GB; path /data). Without it, message_journal/processed_messages/
      # group_states/link_queue are wiped on every restart → fast-deleted
      # messages become un-rescuable + polling max-id resets to 0. ===
      - key: DATA_DIR
        sync: false
      # === [B06] DASHBOARD_API_KEY — optional shared-secret gating /api/*. If
      # UNSET (default), the dashboard API stays OPEN (backward-compatible). Set
      # it to lock /api/* behind an X-Api-Key header. Leave empty for open access. ===
      - key: DASHBOARD_API_KEY
        sync: false
      # === [L07] LEASE_DURATION_S — MessageClaim lease window (was hardcoded
      # 60s). 180s tolerates a 4-account fan-out under FloodWait without
      # prematurely re-claiming in-flight work. ===
      - key: LEASE_DURATION_S
        value: "180"
